[project]
name = "adam3d-anomalib-repro"
version = "0.1.0"
description = "3D-ADAM anomalib baseline reproduction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anomalib==2.2.0",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "requests>=2.32",
  "ftfy", "regex", "tqdm",
  # TransFusion / RGB+D extras (imgaug requires numpy<2)
  "einops>=0.8",
  "imgaug>=0.4",
  "opencv-python>=4.8",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "tifffile>=2024.1",
  "positional-encodings>=6.0",
  "scikit-image>=0.22",
  "imageio>=2.34",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires CUDA GPU",
  "dataset: requires datasets/ADAM3D on disk",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
