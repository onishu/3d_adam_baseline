[project]
name = "adam3d-anomalib-repro"
version = "0.1.0"
description = "3D-ADAM anomalib baseline reproduction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anomalib==2.2.0",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "pandas==2.2.3",
  "requests>=2.32",
  "ftfy", "regex", "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
